name: SKIPPER QR workspace artifact
on:
  pull_request:
    paths:
      - 'src/lib/executive-agent/qr-*'
      - 'src/types/qrcode.d.ts'
      - 'src/lib/executive-agent/engine-runtime*'
      - 'src/lib/executive-agent/executive-action-executors.ts'
      - 'src/lib/executive-agent/executive-agent-policy.ts'
      - 'src/app/api/admin/executive-agent/qr/**'
      - 'src/app/api/admin/executive-agent/engine-runtime/route.ts'
      - 'tests/qr/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skipper-qr-artifact.yml'
permissions:
  contents: read
jobs:
  generation-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, tidb]
    env:
      SKIPPER_STEP2_SQL_TEST_ONLY: '1'
      SKIPPER_STEP2_SQL_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Clean dependency and production module gate
        run: node --test tests/qr/renderer.test.mjs
      - name: Start disposable database
        run: |
          if [ "$SKIPPER_STEP2_SQL_ENGINE" = mysql ]; then
            docker run -d --name skipper-qr-db -p 127.0.0.1:41306:3306 -e MYSQL_ROOT_HOST=% -e MYSQL_ROOT_PASSWORD=disposable-ci-root mysql:8.0
          else
            docker run -d --name skipper-qr-db -p 127.0.0.1:41306:4000 pingcap/tidb:v8.5.4 --store=unistore --path=/tmp/skipper-qr --host=0.0.0.0
          fi
      - run: node tests/revenue-loop/prepare-disposable-db.mjs
      - name: Real QR generation, canonical approvals, SQL/savepoints and protected download
        run: node --test tests/qr/database.test.mjs
      - name: Existing canonical gateway and approval regressions
        run: node --test tests/engine-integration/gateway.test.mjs tests/executive-approval/approval-boundary.test.mjs tests/step2/*.test.mjs
      - name: Database diagnostics
        if: failure()
        run: docker logs --tail 40 skipper-qr-db
      - name: Remove disposable database
        if: always()
        run: docker rm -f skipper-qr-db || true
