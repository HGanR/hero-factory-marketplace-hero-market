name: SKIPPER production engine access repairs
on:
  pull_request:
    paths:
      - 'src/lib/security/engine-route-access.ts'
      - 'src/lib/admin/admin-session-jwt.ts'
      - 'src/app/api/certificates/**'
      - 'src/app/api/admin/troo-world/placements/**'
      - 'tests/engine-access/**'
      - '.github/workflows/skipper-engine-access.yml'
permissions:
  contents: read
jobs:
  route-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Real routes and real signed-session checks
        run: node --test tests/engine-access/routes.test.mjs
      - name: Gateway and canonical decision regressions
        run: node --test tests/engine-integration/gateway.test.mjs tests/executive-approval/approval-boundary.test.mjs tests/step2/*.test.mjs
