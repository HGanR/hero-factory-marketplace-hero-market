name: Save and share worlds
on:
  push:
    branches: [fix/save-my-world-sharing-20261110]
  pull_request:
    paths:
      - "src/app/api/worlds/**"
      - "src/app/worlds/**"
      - "src/components/world-editor/DraftSaveBar.tsx"
      - "src/lib/world-write.ts"
      - "tests/worlds/**"
      - ".github/workflows/world-save.yml"
permissions:
  contents: read
jobs:
  world-save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated test dependencies
        run: npm install --prefix "$RUNNER_TEMP/world-save-check" --no-package-lock --ignore-scripts --no-audit --no-fund typescript@5 react@19.2.1 react-dom@19.2.1 jsdom@26 drizzle-orm@0.45.0 mysql2@3.15.3 @types/node@20
      - name: Save, reload, rollback, access and share controls
        run: NODE_PATH="$RUNNER_TEMP/world-save-check/node_modules" node --test tests/worlds/*.test.cjs
      - name: Check transaction helper against database driver types
        run: |
          cp src/lib/world-write.ts "$RUNNER_TEMP/world-save-check/world-write.ts"
          "$RUNNER_TEMP/world-save-check/node_modules/.bin/tsc" --noEmit --strict --skipLibCheck --esModuleInterop --module commonjs --moduleResolution node --target ES2022 --typeRoots "$RUNNER_TEMP/world-save-check/node_modules/@types" "$RUNNER_TEMP/world-save-check/world-write.ts"
