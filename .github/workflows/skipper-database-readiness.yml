name: SKIPPER application database readiness
on:
  pull_request:
    paths:
      - 'src/lib/executive-agent/database-readiness.ts'
      - 'src/app/api/admin/executive-agent/database-readiness/**'
      - 'src/lib/admin/get-executive-admin-user-id.ts'
      - 'src/lib/db/**'
      - 'tests/database-readiness/**'
      - '.github/workflows/skipper-database-readiness.yml'
permissions:
  contents: read
jobs:
  metadata-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/database-readiness/database-readiness.test.mjs
