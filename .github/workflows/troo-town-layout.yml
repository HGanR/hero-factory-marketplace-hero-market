name: Green Terrain to Troo Town
on:
  pull_request:
    paths:
      - 'src/components/green-terrain/**'
      - 'src/app/green-terrain/**'
      - 'src/app/troo-town/**'
      - 'src/app/api/**/green-terrain-layout/**'
      - 'src/lib/troo-world/green-terrain-*'
      - 'src/lib/troo-world/ambient-town.ts'
      - 'src/lib/troo-world/airport*'
      - 'src/lib/troo-world/stadium-*'
      - 'src/lib/troo-world/touch-navigation.ts'
      - 'src/lib/troo-world/town-placement.ts'
      - 'src/app/api/troo-world/stadium/**'
      - 'src/app/api/livekit/token/**'
      - 'sql/stadium-event-challenges.sql'
      - 'public/models/world-assets/airport_cycle_30min.glb'
      - 'src/lib/db/schema.green-terrain.ts'
      - 'sql/green-terrain-layouts.sql'
      - 'scripts/apply-green-terrain-layout-schema.cjs'
      - 'tests/troo-town/**'
      - '.github/workflows/troo-town-layout.yml'
jobs:
  layout-and-sql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture
          MYSQL_DATABASE: town_layout_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/town-test-deps --ignore-scripts --no-audit --no-fund esbuild@0.25.12 drizzle-orm@0.45.0 mysql2@3.15.3 jose@5.9.6 react@19.2.0 react-dom@19.2.0 jsdom@26 @testing-library/react@16 three@0.182.0 @react-three/fiber@9.4.2 @react-three/drei@10.7.7 playwright@1.62.1 viem@2.41.2 livekit-server-sdk@2.15.2 livekit-client@2.18.7
      - name: Stadium admission policy, wallet signatures, protected tokens and connected sidewalks
        run: node --test tests/troo-town/stadium-events.test.cjs tests/troo-town/stadium-admission.test.cjs tests/troo-town/stadium-admission-ui.test.cjs tests/troo-town/touch-placement.test.cjs
        env:
          TOWN_TEST_DEPS: /tmp/town-test-deps/node_modules
          NODE_PATH: /tmp/town-test-deps/node_modules
      - name: Preserve the mounted town during focus refresh and dispose optional image loads
        run: node --test tests/troo-town/refresh-lifecycle.test.cjs
        env:
          NODE_PATH: /tmp/town-test-deps/node_modules
      - name: Airport placement, actual GLB animation and visitor playback
        run: node --test tests/troo-town/airport.test.cjs tests/troo-town/airport-controls.test.cjs
        env:
          TOWN_TEST_DEPS: /tmp/town-test-deps/node_modules
          NODE_PATH: /tmp/town-test-deps/node_modules
      - name: Contracts, shared-renderer boundaries and sidewalk safety
        run: node --test tests/troo-town/layout.test.cjs tests/troo-town/schema-gate.test.cjs
        env:
          TOWN_TEST_DEPS: /tmp/town-test-deps/node_modules
          NODE_PATH: /tmp/town-test-deps/node_modules
      - name: Bundle both pages and shared 3D scene with reachable local modules
        run: node tests/troo-town/compile-ui.cjs
        env:
          TOWN_TEST_DEPS: /tmp/town-test-deps/node_modules
          NODE_PATH: /tmp/town-test-deps/node_modules
      - name: Real MySQL transactions, public reads and canonical signed-session gate
        run: node --test tests/troo-town/sql.test.cjs
        env:
          TOWN_SQL_URL: mysql://root:fixture@127.0.0.1:3306/town_layout_test
          TOWN_TEST_DEPS: /tmp/town-test-deps/node_modules
          NODE_PATH: /tmp/town-test-deps/node_modules


      - name: Install Chromium for actual WebGL airport interaction
        run: /tmp/town-test-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual R3F/Drei airport playback and visual evidence
        run: node tests/troo-town/airport-visual.cjs
        env:
          TOWN_TEST_DEPS: /tmp/town-test-deps/node_modules
          NODE_PATH: /tmp/town-test-deps/node_modules
      - name: Actual stadium screens, seats, event upload and ticker editor
        if: ${{ !cancelled() }}
        run: node tests/troo-town/stadium-events-visual.cjs
        env:
          TOWN_TEST_DEPS: /tmp/town-test-deps/node_modules
          NODE_PATH: /tmp/town-test-deps/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stadium-event-evidence
          path: stadium-event-artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airport-visual-evidence
          path: airport-visual-artifacts/
