<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avatar Creator Library — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0a0a14; font-family: 'Inter', system-ui, sans-serif; }

    #app-header {
      height: 48px;
      background: #0f0f1a;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      position: relative;
      z-index: 100;
    }

    #app-header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #e8e8f0;
      letter-spacing: 0.02em;
    }

    .header-badge {
      font-size: 10px;
      font-weight: 700;
      background: #e94560;
      color: #fff;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #avatar-root {
      width: 100%;
      height: calc(100vh - 48px);
    }
  </style>
  <!-- Three.js from CDN (importmap for demo) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
  <!-- Library CSS -->
  <link rel="stylesheet" href="../src/ui/avatar-library.css" />
</head>
<body>

  <header id="app-header">
    <h1>🧑 Avatar Creator</h1>
    <span class="header-badge">3D Library</span>
  </header>

  <div id="avatar-root"></div>

  <script type="module">
    import { AvatarCreator } from '../src/AvatarCreator.js';

    const root = document.getElementById('avatar-root');
    const creator = new AvatarCreator(root, {
      engine: {
        backgroundColor: 0x0f0f1a,
        ambientIntensity: 0.7,
        directionalIntensity: 1.3,
      }
    });

    // Listen for save events
    creator.on('avatarSaved', (state) => {
      console.log('Avatar saved:', state);
    });

    // Expose globally for console access
    window.avatarCreator = creator;
    console.log(
      '%c Avatar Creator Library loaded! %c\nUse window.avatarCreator to interact via JS.\nExample: avatarCreator.engine.setSkinTone("#8B4513")',
      'background:#e94560;color:#fff;font-weight:bold;padding:4px 8px;border-radius:4px;',
      'color:#aaa'
    );
  </script>
</body>
</html>
